<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Performance Analytics — Trading Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg:        #080c10;
    --panel:     #0d1218;
    --border:    #1a2332;
    --accent:    #00e5ff;
    --green:     #00e676;
    --red:       #ff1744;
    --amber:     #ffab00;
    --text:      #e0eaf5;
    --muted:     #4a6278;
    --font-ui:   'Syne', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 40% at 50% -10%, rgba(0,229,255,0.06) 0%, transparent 70%),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(26,35,50,0.5) 39px, rgba(26,35,50,0.5) 40px),
      repeating-linear-gradient(0deg,  transparent, transparent 39px, rgba(26,35,50,0.5) 39px, rgba(26,35,50,0.5) 40px);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(13,18,24,0.9);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
  header nav a {
    color: var(--muted); text-decoration: none; font-size: .8rem;
    letter-spacing: .1em; margin-left: 24px; text-transform: uppercase;
    transition: color .2s;
  }
  header nav a:hover, header nav a.active { color: var(--accent); }

  .container { max-width: 1400px; margin: 0 auto; padding: 28px 20px; }

  /* ── READINESS BANNER ─────────────────────────────────── */
  .readiness-banner {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .readiness-ring {
    flex-shrink: 0;
    position: relative;
    width: 90px; height: 90px;
  }
  .readiness-ring svg { transform: rotate(-90deg); }
  .readiness-ring .label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
  }
  .readiness-ring .pct  { font-size: 1.5rem; font-weight: 600; }
  .readiness-ring .sub  { font-size: .55rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .readiness-info h2    { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
  .readiness-info p     { font-size: .8rem; color: var(--muted); line-height: 1.6; }
  .readiness-msgs       { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .readiness-msg {
    background: rgba(255,171,0,.1);
    border: 1px solid rgba(255,171,0,.3);
    color: var(--amber);
    font-size: .7rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: var(--font-mono);
  }

  /* ── STAT GRID ───────────────────────────────────────── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    transition: border-color .2s;
  }
  .stat-card:hover { border-color: var(--accent); }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-color, var(--accent));
  }
  .stat-card .label { font-size: .65rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
  .stat-card .value { font-size: 1.5rem; font-weight: 800; font-family: var(--font-mono); }
  .stat-card .sub   { font-size: .7rem; color: var(--muted); margin-top: 4px; font-family: var(--font-mono); }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral  { color: var(--accent); }
  .warn     { color: var(--amber); }

  /* ── CHARTS ROW ──────────────────────────────────────── */
  .charts-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }
  .charts-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }
  .chart-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .chart-card h3 {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .chart-wrap { position: relative; height: 200px; }

  /* ── STRATEGY TABLE ──────────────────────────────────── */
  .strategy-section { margin-bottom: 28px; }
  .section-title {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .strategy-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: .78rem; }
  .strategy-table th {
    text-align: left;
    padding: 10px 12px;
    color: var(--muted);
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    border-bottom: 1px solid var(--border);
  }
  .strategy-table td { padding: 10px 12px; border-bottom: 1px solid rgba(26,35,50,.6); }
  .strategy-table tr:hover td { background: rgba(0,229,255,.03); }
  .strategy-table .bar-cell { width: 100px; }
  .bar-bg { background: var(--border); border-radius: 3px; height: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width .6s; }

  /* ── TRADES TABLE ────────────────────────────────────── */
  .trades-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }
  .trade-list-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .trade-list-card h3 {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 14px;
  }
  .trade-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: .78rem;
  }
  .trade-row:last-child { border-bottom: none; }
  .trade-ticker { font-weight: 600; color: var(--accent); }
  .trade-strat  { color: var(--muted); font-size: .65rem; margin-top: 2px; }

  /* ── DAILY LIMIT ─────────────────────────────────────── */
  .limit-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .limit-card input[type=number] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: .9rem;
    padding: 8px 12px;
    border-radius: 6px;
    width: 110px;
  }
  .limit-card button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: .8rem;
    letter-spacing: .06em;
    cursor: pointer;
  }
  .limit-status {
    font-family: var(--font-mono);
    font-size: .85rem;
    padding: 8px 16px;
    border-radius: 6px;
  }
  .limit-ok   { background: rgba(0,230,118,.1); color: var(--green); border: 1px solid rgba(0,230,118,.3); }
  .limit-stop { background: rgba(255,23,68,.1);  color: var(--red);   border: 1px solid rgba(255,23,68,.3); }

  /* ── LOADING / EMPTY ─────────────────────────────────── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: var(--muted); font-size: .85rem;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .pulse { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: .85rem;
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 12px; opacity: .4; }

  @media (max-width: 900px) {
    .charts-row, .charts-row-3, .trades-grid { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>⚡ Trading Analytics</h1>
  <nav>
    <a href="/dashboard.html">← Live Dashboard</a>
    <a href="/analytics.html" class="active">Performance</a>
  </nav>
</header>

<div class="container">

  <!-- Daily Loss Limit -->
  <div class="limit-card">
    <span style="font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Daily Loss Limit</span>
    <input type="number" id="limitInput" value="200" min="1"/>
    <button onclick="checkLimit()">Check</button>
    <div id="limitStatus" class="limit-status limit-ok" style="display:none"></div>
    <span id="todayPnlBadge" style="font-family:var(--font-mono);font-size:.85rem;margin-left:auto"></span>
  </div>

  <!-- Readiness Banner -->
  <div class="readiness-banner" id="readinessBanner">
    <div class="loading pulse">Loading analytics…</div>
  </div>

  <!-- Top Stats -->
  <div class="stat-grid" id="statGrid">
    <!-- populated by JS -->
  </div>

  <!-- Equity Curve + Win Rate -->
  <div class="charts-row">
    <div class="chart-card">
      <h3>Equity Curve</h3>
      <div class="chart-wrap"><canvas id="equityChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Weekly P&amp;L</h3>
      <div class="chart-wrap"><canvas id="weeklyChart"></canvas></div>
    </div>
  </div>

  <!-- Monthly + Daily + Hour -->
  <div class="charts-row-3">
    <div class="chart-card">
      <h3>Monthly P&amp;L</h3>
      <div class="chart-wrap"><canvas id="monthlyChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Daily P&amp;L (last 30d)</h3>
      <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Best Hours (UTC)</h3>
      <div class="chart-wrap"><canvas id="hourChart"></canvas></div>
    </div>
  </div>

  <!-- Strategy Breakdown -->
  <div class="strategy-section">
    <div class="section-title">Strategy Breakdown — which scanners are actually making money</div>
    <div id="strategyTable">
      <div class="loading pulse">Loading…</div>
    </div>
  </div>

  <!-- Best / Worst Trades -->
  <div class="trades-grid">
    <div class="trade-list-card">
      <h3 style="color:var(--green)">🏆 Best Trades</h3>
      <div id="bestTrades"></div>
    </div>
    <div class="trade-list-card">
      <h3 style="color:var(--red)">💀 Worst Trades</h3>
      <div id="worstTrades"></div>
    </div>
  </div>

</div>

<script>
// ── Chart defaults ───────────────────────────────────────────
Chart.defaults.color = '#4a6278';
Chart.defaults.borderColor = '#1a2332';
Chart.defaults.font.family = "'IBM Plex Mono', monospace";
Chart.defaults.font.size = 10;

const $ = id => document.getElementById(id);
let equityChartInst, weeklyChartInst, monthlyChartInst, dailyChartInst, hourChartInst;

// ── Fetch analytics ──────────────────────────────────────────
async function loadAnalytics() {
  try {
    const res  = await fetch('/api/analytics/overview');
    const data = await res.json();
    renderAll(data);
  } catch (e) {
    $('readinessBanner').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Could not reach server. Make sure the backend is running.</div>`;
  }
}

// ── Render everything ────────────────────────────────────────
function renderAll(d) {
  renderReadiness(d);
  renderStats(d);
  renderEquity(d.equityCurve);
  renderWeekly(d.weeklyPnl);
  renderMonthly(d.monthlyPnl);
  renderDaily(d.dailyPnl.slice(-30));
  renderHour(d.byHour);
  renderStrategies(d.byStrategy);
  renderBestWorst(d.bestTrades, d.worstTrades);
  renderTodayBadge(d.todayPnl, d.weekPnl);
}

// ── Readiness ring ───────────────────────────────────────────
function renderReadiness(d) {
  const r = d.readiness || 0;
  const color = r >= 80 ? '#00e676' : r >= 50 ? '#ffab00' : '#ff1744';
  const radius = 36, circ = 2 * Math.PI * radius;
  const dash = (r / 100) * circ;
  const msgs = d.readinessMessages || [];
  const label = r >= 80 ? 'Ready 🚀' : r >= 50 ? 'Getting there' : 'Not yet';

  $('readinessBanner').innerHTML = `
    <div class="readiness-ring">
      <svg width="90" height="90" viewBox="0 0 90 90">
        <circle cx="45" cy="45" r="${radius}" fill="none" stroke="#1a2332" stroke-width="8"/>
        <circle cx="45" cy="45" r="${radius}" fill="none" stroke="${color}" stroke-width="8"
          stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
      </svg>
      <div class="label">
        <span class="pct" style="color:${color}">${r}%</span>
        <span class="sub">Ready</span>
      </div>
    </div>
    <div class="readiness-info">
      <h2>Full-Time Readiness: <span style="color:${color}">${label}</span></h2>
      <p>Based on your trade data — win rate, R:R, profit factor, drawdown, and sample size.</p>
      <div class="readiness-msgs">
        ${msgs.length ? msgs.map(m => `<span class="readiness-msg">⚠ ${m}</span>`).join('') : '<span class="readiness-msg" style="background:rgba(0,230,118,.1);border-color:rgba(0,230,118,.3);color:#00e676">✓ All criteria met</span>'}
      </div>
    </div>
    <div style="margin-left:auto;text-align:right;font-family:var(--font-mono);font-size:.75rem;color:var(--muted)">
      <div>Signals: <strong style="color:var(--text)">${d.totalSignals}</strong></div>
      <div>Rejected: <strong style="color:var(--red)">${d.totalRejected}</strong></div>
      <div>Accept rate: <strong style="color:var(--accent)">${d.signalAcceptRate}%</strong></div>
    </div>
  `;
}

// ── Top stat cards ───────────────────────────────────────────
function renderStats(d) {
  const o = d.overall;
  if (!o) {
    $('statGrid').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">📊</div>No closed trades yet. Trades will appear here once your scanner starts executing.</div>';
    return;
  }
  const cards = [
    { label: 'Total P&L',       value: fmt(o.totalPnl),          color: o.totalPnl >= 0 ? '--green' : '--red',    sub: 'all time' },
    { label: 'Today',           value: fmt(d.todayPnl),           color: d.todayPnl >= 0 ? '--green' : '--red',   sub: 'closed trades' },
    { label: 'This Week',       value: fmt(d.weekPnl),            color: d.weekPnl >= 0  ? '--green' : '--red',   sub: '7 days' },
    { label: 'Win Rate',        value: o.winRate + '%',           color: o.winRate >= 50 ? '--green' : '--amber',  sub: `${o.wins}W / ${o.losses}L` },
    { label: 'R:R Ratio',       value: o.rrRatio + 'x',          color: o.rrRatio >= 1.5 ? '--green' : '--amber', sub: 'avg win / avg loss' },
    { label: 'Profit Factor',   value: o.profitFactor,            color: o.profitFactor >= 1.5 ? '--green' : '--amber', sub: 'gross win / gross loss' },
    { label: 'Max Drawdown',    value: fmt(o.maxDrawdown),        color: '--red',                                  sub: 'peak to trough' },
    { label: 'Total Trades',    value: o.totalTrades,             color: '--accent',                               sub: `${o.totalTrades >= 50 ? '✓' : '⚠'} need 50+` },
    { label: 'Avg Hold',        value: fmtMins(o.avgHoldMin),     color: '--accent',                               sub: 'per trade' },
    { label: 'Best Streak',     value: o.maxConsecWins + 'W',     color: '--green',                                sub: 'consecutive wins' },
    { label: 'Worst Streak',    value: o.maxConsecLoss + 'L',     color: '--red',                                  sub: 'consecutive losses' },
    { label: 'Avg Win',         value: fmt(o.avgWin),             color: '--green',                                sub: 'per winning trade' },
    { label: 'Avg Loss',        value: '-' + fmt(o.avgLoss),      color: '--red',                                  sub: 'per losing trade' },
  ];
  $('statGrid').innerHTML = cards.map(c => `
    <div class="stat-card" style="--accent-color:var(${c.color})">
      <div class="label">${c.label}</div>
      <div class="value" style="color:var(${c.color})">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>
  `).join('');
}

// ── Equity curve ─────────────────────────────────────────────
function renderEquity(data) {
  if (!data || !data.length) return;
  const ctx = $('equityChart').getContext('2d');
  if (equityChartInst) equityChartInst.destroy();
  const grad = ctx.createLinearGradient(0, 0, 0, 200);
  grad.addColorStop(0, 'rgba(0,229,255,0.25)');
  grad.addColorStop(1, 'rgba(0,229,255,0)');
  equityChartInst = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.date.slice(5)),
      datasets: [{ data: data.map(d => d.equity), borderColor: '#00e5ff', borderWidth: 2, fill: true, backgroundColor: grad, tension: 0.3, pointRadius: 0 }]
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#1a2332' } } }, interaction: { mode: 'index', intersect: false } }
  });
}

// ── Weekly P&L ───────────────────────────────────────────────
function renderWeekly(data) {
  if (!data || !data.length) return;
  const ctx = $('weeklyChart').getContext('2d');
  if (weeklyChartInst) weeklyChartInst.destroy();
  weeklyChartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(d => d.week.slice(5)),
      datasets: [{ data: data.map(d => d.pnl), backgroundColor: data.map(d => d.pnl >= 0 ? 'rgba(0,230,118,.7)' : 'rgba(255,23,68,.7)'), borderRadius: 4 }]
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#1a2332' } } } }
  });
}

// ── Monthly P&L ──────────────────────────────────────────────
function renderMonthly(data) {
  if (!data || !data.length) return;
  const ctx = $('monthlyChart').getContext('2d');
  if (monthlyChartInst) monthlyChartInst.destroy();
  monthlyChartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(d => d.month),
      datasets: [{ data: data.map(d => d.pnl), backgroundColor: data.map(d => d.pnl >= 0 ? 'rgba(0,230,118,.7)' : 'rgba(255,23,68,.7)'), borderRadius: 4 }]
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#1a2332' } } } }
  });
}

// ── Daily P&L ────────────────────────────────────────────────
function renderDaily(data) {
  if (!data || !data.length) return;
  const ctx = $('dailyChart').getContext('2d');
  if (dailyChartInst) dailyChartInst.destroy();
  dailyChartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.map(d => d.date.slice(5)),
      datasets: [{ data: data.map(d => d.pnl), backgroundColor: data.map(d => d.pnl >= 0 ? 'rgba(0,230,118,.6)' : 'rgba(255,23,68,.6)'), borderRadius: 3 }]
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: '#1a2332' } } } }
  });
}

// ── Best hours ───────────────────────────────────────────────
function renderHour(data) {
  if (!data || !data.length) return;
  const active = data.filter(h => h.wins + h.losses > 0);
  if (!active.length) return;
  const ctx = $('hourChart').getContext('2d');
  if (hourChartInst) hourChartInst.destroy();
  hourChartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: active.map(h => h.hour + ':00'),
      datasets: [{ data: active.map(h => h.pnl), backgroundColor: active.map(h => h.pnl >= 0 ? 'rgba(0,230,118,.7)' : 'rgba(255,23,68,.7)'), borderRadius: 3 }]
    },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { grid: { color: '#1a2332' } } } }
  });
}

// ── Strategy table ───────────────────────────────────────────
function renderStrategies(data) {
  if (!data || !data.length) {
    $('strategyTable').innerHTML = '<div class="empty-state"><div class="icon">📋</div>No strategy data yet.</div>';
    return;
  }
  const maxPnl = Math.max(...data.map(s => Math.abs(s.totalPnl || 0)), 1);
  $('strategyTable').innerHTML = `
    <table class="strategy-table">
      <thead>
        <tr>
          <th>Strategy</th>
          <th>Trades</th>
          <th>Win %</th>
          <th>R:R</th>
          <th>Prof Factor</th>
          <th>Avg Win</th>
          <th>Avg Loss</th>
          <th>Total P&L</th>
          <th>Bar</th>
          <th>Verdict</th>
        </tr>
      </thead>
      <tbody>
        ${data.map(s => {
          if (!s.totalTrades) return '';
          const pct = (Math.abs(s.totalPnl || 0) / maxPnl) * 100;
          const barColor = (s.totalPnl || 0) >= 0 ? '#00e676' : '#ff1744';
          const verdict = getVerdict(s);
          return `
            <tr>
              <td style="color:var(--accent);font-weight:600">${s.name}</td>
              <td>${s.totalTrades}</td>
              <td class="${(s.winRate||0)>=50?'positive':'warn'}">${s.winRate||0}%</td>
              <td class="${(s.rrRatio||0)>=1.5?'positive':'warn'}">${s.rrRatio||0}x</td>
              <td class="${(s.profitFactor||0)>=1.5?'positive':'warn'}">${s.profitFactor||0}</td>
              <td class="positive">${fmt(s.avgWin||0)}</td>
              <td class="negative">-${fmt(s.avgLoss||0)}</td>
              <td class="${(s.totalPnl||0)>=0?'positive':'negative'}" style="font-weight:700">${fmt(s.totalPnl||0)}</td>
              <td class="bar-cell">
                <div class="bar-bg">
                  <div class="bar-fill" style="width:${pct}%;background:${barColor}"></div>
                </div>
              </td>
              <td style="color:${verdict.color};font-size:.65rem">${verdict.label}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

function getVerdict(s) {
  if (!s.totalTrades || s.totalTrades < 5) return { label: 'Too few trades', color: '#4a6278' };
  if ((s.totalPnl||0) > 0 && (s.winRate||0) >= 50 && (s.rrRatio||0) >= 1.5) return { label: '✓ Keep', color: '#00e676' };
  if ((s.totalPnl||0) < 0) return { label: '✗ Review / Kill', color: '#ff1744' };
  if ((s.winRate||0) < 40) return { label: '⚠ Low win rate', color: '#ffab00' };
  return { label: '~ Marginal', color: '#ffab00' };
}

// ── Best / Worst ─────────────────────────────────────────────
function renderBestWorst(best, worst) {
  $('bestTrades').innerHTML  = renderTradeList(best);
  $('worstTrades').innerHTML = renderTradeList(worst);
}
function renderTradeList(trades) {
  if (!trades || !trades.length) return '<div class="empty-state" style="padding:20px">No data</div>';
  return trades.map(t => `
    <div class="trade-row">
      <div>
        <div class="trade-ticker">${t.ticker || t.symbol || '—'}</div>
        <div class="trade-strat">${t.strategy || t.scanner || '—'} · ${fmtDate(t.closeTime || t.openTime)}</div>
      </div>
      <div class="${n(t.pnl)>=0?'positive':'negative'}" style="font-weight:700;font-size:.9rem">${fmt(t.pnl)}</div>
    </div>
  `).join('');
}

// ── Today badge ──────────────────────────────────────────────
function renderTodayBadge(todayPnl, weekPnl) {
  const el = $('todayPnlBadge');
  el.innerHTML = `Today: <strong style="color:${todayPnl>=0?'#00e676':'#ff1744'}">${fmt(todayPnl)}</strong>&nbsp;&nbsp;Week: <strong style="color:${weekPnl>=0?'#00e676':'#ff1744'}">${fmt(weekPnl)}</strong>`;
}

// ── Daily limit check ────────────────────────────────────────
async function checkLimit() {
  const limit = $('limitInput').value || 200;
  const res = await fetch(`/api/analytics/daily-limit-check?limit=${limit}`);
  const d = await res.json();
  const el = $('limitStatus');
  el.style.display = 'block';
  if (d.limitHit) {
    el.className = 'limit-status limit-stop';
    el.textContent = `🛑 STOP TRADING — Down ${fmt(Math.abs(d.todayPnl))} today (limit: ${fmt(limit)})`;
  } else {
    el.className = 'limit-status limit-ok';
    el.textContent = `✓ OK — Today P&L: ${fmt(d.todayPnl)} (limit: ${fmt(limit)})`;
  }
}

// ── Formatters ───────────────────────────────────────────────
function n(v) { return isFinite(v) && v !== null ? +v : 0; }
function fmt(v) {
  const val = n(v);
  return (val >= 0 ? '+' : '') + val.toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtMins(m) {
  if (!m) return '—';
  if (m < 60) return Math.round(m) + 'm';
  return Math.floor(m / 60) + 'h ' + Math.round(m % 60) + 'm';
}
function fmtDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// ── Boot ─────────────────────────────────────────────────────
loadAnalytics();
setInterval(loadAnalytics, 60000); // refresh every 60s
</script>
